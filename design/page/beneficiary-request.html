<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../global.css"><title>Beneficiary request</title><header><div class="brand">Policy Endorsement Assistant</div></header><main><button class="switch" type="button" id="lang">ไทย</button><h1 data-en="Request a beneficiary change" data-th="ขอเปลี่ยนผู้รับผลประโยชน์">Request a beneficiary change</h1><section class="panel"><h2 data-en="Your policy" data-th="กรมธรรม์ของคุณ">Your policy</h2><p>DEMO-001 · <strong>ACTIVE</strong></p><p class="small" data-en="This policy is unchanged." data-th="กรมธรรม์นี้ยังไม่เปลี่ยนแปลง">This policy is unchanged.</p></section><form class="panel" onsubmit="event.preventDefault();document.getElementById('result').hidden=false;document.getElementById('result').focus()"><div class="field"><label for="name" data-en="Beneficiary name" data-th="ชื่อผู้รับผลประโยชน์">Beneficiary name</label><input id="name" maxlength="120" required></div><div class="field"><label for="relationship" data-en="Relationship" data-th="ความสัมพันธ์">Relationship</label><input id="relationship" maxlength="120" required></div><p class="notice" data-en="Submitting a request does not change your policy or coverage." data-th="การส่งคำขอไม่เปลี่ยนแปลงกรมธรรม์หรือความคุ้มครอง">Submitting a request does not change your policy or coverage.</p><button data-en="Submit request" data-th="ส่งคำขอ">Submit request</button></form><h2 id="result" tabindex="-1" hidden data-en="Request recorded. Your policy is unchanged." data-th="บันทึกคำขอแล้ว กรมธรรม์ของคุณยังไม่เปลี่ยนแปลง">Request recorded. Your policy is unchanged.</h2><p class="small">Mockup only; no data is saved.</p></main><script src="mockup.js"></script></html>
