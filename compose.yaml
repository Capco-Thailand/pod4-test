services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: endorsement
      POSTGRES_PASSWORD: endorsement
      POSTGRES_DB: endorsement
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U endorsement']
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://endorsement:endorsement@db:5432/endorsement
      SEED_DEMO: 'true'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      retries: 12
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '4173:80'
volumes:
  pgdata:
